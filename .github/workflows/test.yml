name: Run Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_USER: test_user
      TEST_PASSWORD: test_password
      TEST_DB: test_doorbell
      TEST_PORT: 5433
      TEST_REDIS_PORT: 6380
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d db-test redis-test --wait

      - name: Run migrations
        run: docker compose -f docker-compose.test.yml run --rm migrator

      - name: Run tests
        run: pytest