services:
  db-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_USER}
      POSTGRES_PASSWORD: ${TEST_PASSWORD}
      POSTGRES_DB: ${TEST_DB}
      
    ports:
      - "${TEST_PORT}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_USER} -d ${TEST_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    environment:
      DATABASE_URL: postgresql://${TEST_USER}:${TEST_PASSWORD}@db-test:5432/${TEST_DB}?sslmode=disable
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      db-test:
        condition: service_healthy
