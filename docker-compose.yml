name: doorbell-backend
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      db:
        condition: service_healthy

  doorbell_api:
    image: doorbell-api
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./${UPLOAD_FOLDER:-captures}:/app/${UPLOAD_FOLDER:-captures}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  
  doorbell_bot:
    image: doorbell-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    build:
      context: .
      dockerfile: Dockerfile.bot
    volumes:
      - ./${UPLOAD_FOLDER:-captures}:/app/${UPLOAD_FOLDER:-captures}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
     - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: